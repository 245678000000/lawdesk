name: 测试与打包

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: 冒烟测试（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 用 npm 全局安装三个 CLI：在 Windows 上会生成 .cmd 包装脚本，正好验证检测和调用逻辑
      - name: 安装 Claude Code、Codex 与 CodeBuddy CLI
        run: npm install -g @anthropic-ai/claude-code @openai/codex @tencent-ai/codebuddy-code
      # WorkBuddy 桌面版无法在 CI 里安装：按它在 Windows 上的安装结构
      # （%LOCALAPPDATA%\Programs\WorkBuddy\WorkBuddy.exe + resources\app.asar.unpacked\cli）
      # 用 node.exe 和官方 CodeBuddy 包搭一个替身，验证查找与启动逻辑
      - name: 模拟 Windows 上的 WorkBuddy 安装目录
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dst = Join-Path $env:LOCALAPPDATA 'Programs\WorkBuddy'
          New-Item -ItemType Directory -Force -Path (Join-Path $dst 'resources\app.asar.unpacked') | Out-Null
          Copy-Item (Get-Command node).Source (Join-Path $dst 'WorkBuddy.exe')
          $pkg = Join-Path (npm root -g) '@tencent-ai\codebuddy-code'
          New-Item -ItemType Junction -Path (Join-Path $dst 'resources\app.asar.unpacked\cli') -Target $pkg | Out-Null
          "EXPECT_WORKBUDDY=1" >> $env:GITHUB_ENV
      - name: 冒烟测试
        run: npm test
        env:
          EXPECT_CLIS: claude,codex,codebuddy
          TEST_CLI_CALLS: '1'

  windows:
    name: Windows 安装包
    needs: smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: 安装打包工具
        run: npm ci
        working-directory: windows
      - name: 打包
        run: npm run dist
        working-directory: windows
      - name: 静默安装并启动安装后的 App 做端到端测试
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/LawDesk-Setup-*.exe).FullName
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter LawDesk.exe | Select-Object -First 1
          if (-not $exe) { throw '安装后没有找到 LawDesk.exe' }
          Write-Host "已安装到 $($exe.FullName)"
          node test/e2e-desktop.mjs $exe.FullName --shot dist/screenshot-windows.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LawDesk-windows-x64
          path: |
            dist/LawDesk-Setup-*.exe
            dist/screenshot-windows.png
          if-no-files-found: ignore
